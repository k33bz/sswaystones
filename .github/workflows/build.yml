name: build

# One pipeline per supported Minecraft line: main = newest (26.3), 26.x branches = backports.
on:
  push:
    branches: [main, '26.*']
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to push README badge data to the `badges` branch (release lines)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Minecraft version
        run: |
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "MC_VERSION=$MC" >> "$GITHUB_ENV"
          echo "### sswaystones on Minecraft $MC (\`$GITHUB_REF_NAME\`)" >> "$GITHUB_STEP_SUMMARY"
      # spotless is skipped here: its eclipse formatter comes from download.eclipse.org,
      # which 500s now and then. It runs below as a non-fatal step instead.
      - name: Build + tests
        run: ./gradlew build -x spotlessJava -x spotlessCheck -x spotlessMisc
      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, re, sys
          t = f = e = s = 0
          for p in glob.glob('build/test-results/test/*.xml'):
              head = open(p, encoding='utf-8').read(4096)
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', head)
              t += int(m[1]); s += int(m[2]); f += int(m[3]); e += int(m[4])
          print(f"Unit tests: **{t}** run, {f} failed, {e} errors, {s} skipped")
          if t == 0:
              print("::error::no unit tests ran", file=sys.stderr)
              sys.exit(1)
          EOF
      # Boot a real Fabric server (newest release of this line, newest fabric-api) with the jar
      # and drive it through the console: commands, every village template, a placed waystone,
      # a generated village. Writes build/server-test/versions.json for the badges below.
      - name: Server test (real Fabric server)
        run: python3 scripts/server_test.py
      - name: Upload server-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-log-${{ env.MC_VERSION }}
          path: build/server-test/console.log
          if-no-files-found: ignore
      # README badges per release line (scripts/publish_badges.py -> orphan `badges` branch).
      # Pushes to a release line only: a PR or feature branch must never overwrite what they report.
      - name: Publish version badges
        if: always() && github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, '26.')) && hashFiles('build/server-test/versions.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/publish_badges.py --branch "$GITHUB_REF_NAME" --out /tmp/badges
          bash scripts/commit_badges.sh /tmp/badges "$GITHUB_REF_NAME @ ${GITHUB_SHA::7}" || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ env.MC_VERSION }}
          path: build/reports/tests/test
          if-no-files-found: ignore
      - name: Spotless check (non-fatal)
        continue-on-error: true
        run: ./gradlew spotlessCheck
      - name: Artifact slug
        run: echo "ARTIFACT_SLUG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: sswaystones-${{ env.MC_VERSION }}-${{ env.ARTIFACT_SLUG }}
          path: build/libs/*.jar
